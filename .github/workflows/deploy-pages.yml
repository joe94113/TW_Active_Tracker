name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture checkout data baseline
        run: node scripts/validate-data-quality.mjs --write-baseline "$RUNNER_TEMP/data-quality-baseline.json"

      - name: Refresh static market data
        run: |
          for attempt in 1 2; do
            echo "data:update attempt ${attempt}/2"
            if npm run data:update; then
              exit 0
            fi
            if [ "${attempt}" -eq 2 ]; then
              echo "data:update failed after ${attempt} attempts"
              exit 1
            fi
            echo "Transient update failure; cooling down for 180 seconds before the final attempt."
            sleep 180
          done

      - name: Validate refreshed data quality
        run: node scripts/validate-data-quality.mjs --baseline "$RUNNER_TEMP/data-quality-baseline.json"

      - name: Build site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
