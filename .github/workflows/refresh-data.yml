name: Refresh Market Data

on:
  workflow_dispatch:
  schedule:
    # GitHub scheduled workflows are best-effort. Avoid the busy :00/:15/:30/:45
    # slots so intraday refreshes are less likely to be delayed or dropped.
    - cron: '7,22,37,52 1-5 * * 1-5'
    - cron: '7,22,37 6 * * 1-5'
    - cron: '50 6 * * 1-5'
    - cron: '20 7 * * 1-5'
    - cron: '35 10 * * 1-5'
    # Late official endpoints can lag after close. Recheck in the evening so
    # the production site catches the final market package before/after digest.
    - cron: '30 11 * * 1-5'
    - cron: '10 12 * * 1-5'
    # Backup close-digest trigger after the primary 20:30 digest schedule.
    - cron: '40 12 * * 1-5'
    - cron: '0 13 * * 1-5'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: refresh-market-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    outputs:
      data_changed: ${{ steps.detect.outputs.changed }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Taipei
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update static market data
        run: npm run data:update

      - name: Report data freshness
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('public/data/manifest.json', 'utf8'));
          const history = JSON.parse(fs.readFileSync('public/data/radar/history.json', 'utf8'));
          const lastSnapshot = history.snapshots?.at(-1);
          console.log(`manifest generated: ${manifest.generatedAtLocalDate} ${manifest.generatedAtLocalTime}`);
          console.log(`radar market date: ${history.marketDate ?? lastSnapshot?.marketDate ?? 'unknown'}`);
          console.log(`stable picks: ${lastSnapshot?.stable?.length ?? 0}`);
          console.log(`aggressive picks: ${lastSnapshot?.aggressive?.length ?? 0}`);
          NODE

      - name: Detect refreshed data changes
        id: detect
        run: |
          if git diff --quiet -- public/data; then
            echo "No data changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Build site
        if: steps.detect.outputs.changed == 'true'
        run: npm run build

      - name: Setup Pages
        if: steps.detect.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.detect.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    needs: refresh
    if: needs.refresh.outputs.data_changed == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  notify-close:
    needs:
      - refresh
    if: needs.refresh.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: close-digest-${{ github.ref }}
      cancel-in-progress: false
    env:
      TZ: Asia/Taipei
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}

    steps:
      - name: Resolve digest target date
        id: target
        run: |
          TAIPEI_DATE="$(TZ=Asia/Taipei date +%F)"
          TAIPEI_HOUR="$(TZ=Asia/Taipei date +%H)"
          TAIPEI_HOUR_NUM=$((10#${TAIPEI_HOUR}))
          if [ "${TAIPEI_HOUR_NUM}" -lt 6 ]; then
            TARGET_DATE="$(TZ=Asia/Taipei date -d "${TAIPEI_DATE} -1 day" +%F)"
          else
            TARGET_DATE="${TAIPEI_DATE}"
          fi

          SHOULD_ATTEMPT=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${TAIPEI_HOUR_NUM}" -ge 19 ] || [ "${TAIPEI_HOUR_NUM}" -lt 6 ]; then
            SHOULD_ATTEMPT=true
          fi

          echo "MARKET_DATA_DATE=${TARGET_DATE}" >> "$GITHUB_ENV"
          echo "DIGEST_TARGET_DATE=${TARGET_DATE}" >> "$GITHUB_ENV"
          echo "target_date=${TARGET_DATE}" >> "$GITHUB_OUTPUT"
          echo "should_attempt=${SHOULD_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "Digest target date: ${TARGET_DATE}"
          echo "Taipei hour: ${TAIPEI_HOUR}; should attempt digest: ${SHOULD_ATTEMPT}"

      - name: Skip outside digest window
        if: steps.target.outputs.should_attempt != 'true'
        run: echo "Not in the evening digest window. Skip refresh backup send."

      - name: Restore digest send lock
        id: digest-lock
        if: steps.target.outputs.should_attempt == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .digest-send-lock
          key: close-digest-${{ steps.target.outputs.target_date }}

      - name: Skip duplicate digest
        if: steps.target.outputs.should_attempt == 'true' && steps.digest-lock.outputs.cache-hit == 'true'
        run: echo "Close digest already sent for $DIGEST_TARGET_DATE. Skip refresh backup send."

      - name: Checkout
        if: steps.target.outputs.should_attempt == 'true' && steps.digest-lock.outputs.cache-hit != 'true'
        uses: actions/checkout@v5

      - name: Setup Node
        if: steps.target.outputs.should_attempt == 'true' && steps.digest-lock.outputs.cache-hit != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.target.outputs.should_attempt == 'true' && steps.digest-lock.outputs.cache-hit != 'true'
        run: npm ci

      - name: Refresh digest data snapshot
        if: steps.target.outputs.should_attempt == 'true' && steps.digest-lock.outputs.cache-hit != 'true'
        run: |
          for attempt in 1 2; do
            echo "data:update attempt ${attempt} for ${MARKET_DATA_DATE}"
            if npm run data:update; then
              exit 0
            fi
            if [ "${attempt}" -eq 2 ]; then
              echo "data:update failed after ${attempt} attempts"
              exit 1
            fi
            sleep 120
          done

      - name: Validate digest payload
        id: digest-ready
        if: steps.target.outputs.should_attempt == 'true' && steps.digest-lock.outputs.cache-hit != 'true'
        run: |
          node --input-type=module - <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { buildCloseDigestSummary, loadCloseDigestData } from './scripts/lib/close-digest.mjs';

          const targetDate = process.env.DIGEST_TARGET_DATE;
          const data = await loadCloseDigestData();
          const summary = buildCloseDigestSummary({
            ...data,
            today: targetDate,
          });
          const canSend = Boolean(summary);
          appendFileSync(process.env.GITHUB_OUTPUT, `can_send=${canSend}\n`);
          console.log(canSend
            ? `Digest payload is ready for ${targetDate}.`
            : `Digest payload is not ready for ${targetDate}; skip refresh backup send.`);
          NODE

      - name: Send Telegram digest
        if: steps.digest-ready.outputs.can_send == 'true'
        run: node scripts/send-telegram-brief.mjs

      - name: Send Discord digest
        if: steps.digest-ready.outputs.can_send == 'true'
        run: node scripts/send-discord-brief.mjs

      - name: Send LINE digest
        if: steps.digest-ready.outputs.can_send == 'true'
        run: node scripts/send-line-brief.mjs

      - name: Write digest send lock
        if: steps.digest-ready.outputs.can_send == 'true'
        run: |
          mkdir -p .digest-send-lock
          echo "sent_at=$(date -Iseconds)" > ".digest-send-lock/${DIGEST_TARGET_DATE}.txt"

      - name: Save digest send lock
        if: steps.digest-ready.outputs.can_send == 'true'
        uses: actions/cache/save@v4
        with:
          path: .digest-send-lock
          key: close-digest-${{ steps.target.outputs.target_date }}
