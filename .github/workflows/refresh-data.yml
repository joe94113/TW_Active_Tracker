name: Refresh Market Data

on:
  workflow_dispatch:
  schedule:
    # GitHub scheduled workflows are best-effort. Avoid the busy :00/:15/:30/:45
    # slots so intraday refreshes are less likely to be delayed or dropped.
    - cron: '7,22,37,52 1-5 * * 1-5'
    - cron: '7,22,37 6 * * 1-5'
    - cron: '50 6 * * 1-5'
    - cron: '20 7 * * 1-5'
    - cron: '35 10 * * 1-5'
    # Late official endpoints can lag after close. Recheck in the evening so
    # the production site catches the final market package before/after digest.
    - cron: '30 11 * * 1-5'
    - cron: '10 12 * * 1-5'
    - cron: '0 13 * * 1-5'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: refresh-market-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    outputs:
      data_changed: ${{ steps.detect.outputs.changed }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Taipei
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update static market data
        run: npm run data:update

      - name: Report data freshness
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('public/data/manifest.json', 'utf8'));
          const history = JSON.parse(fs.readFileSync('public/data/radar/history.json', 'utf8'));
          const lastSnapshot = history.snapshots?.at(-1);
          console.log(`manifest generated: ${manifest.generatedAtLocalDate} ${manifest.generatedAtLocalTime}`);
          console.log(`radar market date: ${history.marketDate ?? lastSnapshot?.marketDate ?? 'unknown'}`);
          console.log(`stable picks: ${lastSnapshot?.stable?.length ?? 0}`);
          console.log(`aggressive picks: ${lastSnapshot?.aggressive?.length ?? 0}`);
          NODE

      - name: Detect refreshed data changes
        id: detect
        run: |
          if git diff --quiet -- public/data; then
            echo "No data changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Build site
        if: steps.detect.outputs.changed == 'true'
        run: npm run build

      - name: Setup Pages
        if: steps.detect.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.detect.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    needs: refresh
    if: needs.refresh.outputs.data_changed == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  notify-close:
    needs:
      - refresh
      - deploy
    if: needs.refresh.outputs.data_changed == 'true' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TZ: Asia/Taipei
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh digest data snapshot
        run: npm run data:update || echo "data:update completed with partial upstream failures"

      - name: Send Telegram digest
        run: node scripts/send-telegram-brief.mjs

      - name: Send Discord digest
        run: node scripts/send-discord-brief.mjs

      - name: Send LINE digest
        run: node scripts/send-line-brief.mjs
