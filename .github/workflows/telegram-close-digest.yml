name: Send Close Notifications

on:
  workflow_dispatch:
  schedule:
    # 20:30 Asia/Taipei. GitHub Actions schedules use UTC.
    # Fallback windows reduce the chance of missing a weekday digest when
    # GitHub's best-effort scheduler delays or drops the first run.
    - cron: '30 12 * * 1-5'
    - cron: '10 13 * * 1-5'
    - cron: '10 14 * * 1-5'
    - cron: '10 15 * * 1-5'

permissions:
  contents: read

concurrency:
  group: telegram-close-digest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Taipei
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Resolve digest target date
        id: target
        run: |
          TARGET_DATE="$(node --input-type=module - <<'NODE'
          import { getDigestTargetDate } from './scripts/lib/close-digest.mjs';
          console.log(getDigestTargetDate());
          NODE
          )"
          echo "MARKET_DATA_DATE=${TARGET_DATE}" >> "$GITHUB_ENV"
          echo "DIGEST_TARGET_DATE=${TARGET_DATE}" >> "$GITHUB_ENV"
          echo "target_date=${TARGET_DATE}" >> "$GITHUB_OUTPUT"
          echo "Digest target date: ${TARGET_DATE}"

      - name: Restore scheduled digest send lock
        id: digest-lock
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: .digest-send-lock
          key: close-digest-${{ steps.target.outputs.target_date }}

      - name: Skip duplicate scheduled digest
        if: github.event_name == 'schedule' && steps.digest-lock.outputs.cache-hit == 'true'
        run: echo "Close digest already sent for $DIGEST_TARGET_DATE. Skip fallback run."

      - name: Refresh digest data snapshot
        if: github.event_name != 'schedule' || steps.digest-lock.outputs.cache-hit != 'true'
        run: |
          for attempt in 1 2; do
            echo "data:update attempt ${attempt} for ${MARKET_DATA_DATE}"
            if npm run data:update; then
              exit 0
            fi
            if [ "${attempt}" -eq 2 ]; then
              echo "data:update failed after ${attempt} attempts"
              exit 1
            fi
            sleep 120
          done

      - name: Report digest freshness
        if: github.event_name != 'schedule' || steps.digest-lock.outputs.cache-hit != 'true'
        run: |
          node --input-type=module - <<'NODE'
          const fs = require('node:fs');
          import { formatTaipeiDate, getDigestTargetDate } from './scripts/lib/close-digest.mjs';
          function collectIsoDates(text) {
            return [...new Set(String(text).match(/\d{4}-\d{2}-\d{2}/g) ?? [])].sort();
          }
          const today = formatTaipeiDate();
          const targetDate = process.env.DIGEST_TARGET_DATE || getDigestTargetDate();
          const dashboardText = fs.readFileSync('public/data/dashboard.json', 'utf8');
          const history = JSON.parse(fs.readFileSync('public/data/radar/history.json', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('public/data/manifest.json', 'utf8'));
          const dashboardDates = collectIsoDates(dashboardText);
          const marketDate = history?.marketDate ?? history?.snapshots?.at(-1)?.marketDate ?? dashboardDates.at(-1) ?? 'unknown';
          const lastSnapshot = history?.snapshots?.at(-1);
          console.log(`today: ${today}`);
          console.log(`target digest date: ${targetDate}`);
          console.log(`digest market date: ${marketDate}`);
          console.log(`dashboard latest date seen: ${dashboardDates.at(-1) ?? 'unknown'}`);
          console.log(`manifest generated: ${manifest.generatedAtLocalDate} ${manifest.generatedAtLocalTime}`);
          console.log(`radar stable picks: ${lastSnapshot?.stable?.length ?? 0}`);
          console.log(`radar aggressive picks: ${lastSnapshot?.aggressive?.length ?? 0}`);
          if (marketDate !== targetDate) {
            console.log(`Digest will skip push because market date ${marketDate} does not match target digest date ${targetDate}.`);
          }
          NODE

      - name: Validate digest payload
        id: digest-ready
        if: github.event_name != 'schedule' || steps.digest-lock.outputs.cache-hit != 'true'
        run: |
          node --input-type=module - <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { buildCloseDigestSummary, loadCloseDigestData } from './scripts/lib/close-digest.mjs';

          const targetDate = process.env.DIGEST_TARGET_DATE;
          const data = await loadCloseDigestData();
          const summary = buildCloseDigestSummary({
            ...data,
            today: targetDate,
          });
          const canSend = Boolean(summary);
          appendFileSync(process.env.GITHUB_OUTPUT, `can_send=${canSend}\n`);
          console.log(canSend
            ? `Digest payload is ready for ${targetDate}.`
            : `Digest payload is not ready for ${targetDate}; fallback schedule may try again later.`);
          NODE

      - name: Send Telegram digest
        if: steps.digest-ready.outputs.can_send == 'true'
        run: node scripts/send-telegram-brief.mjs

      - name: Send Discord digest
        if: steps.digest-ready.outputs.can_send == 'true'
        run: node scripts/send-discord-brief.mjs

      - name: Send LINE digest
        if: steps.digest-ready.outputs.can_send == 'true'
        run: node scripts/send-line-brief.mjs

      - name: Write scheduled digest send lock
        if: github.event_name == 'schedule' && steps.digest-ready.outputs.can_send == 'true'
        run: |
          mkdir -p .digest-send-lock
          echo "sent_at=$(date -Iseconds)" > ".digest-send-lock/${DIGEST_TARGET_DATE}.txt"

      - name: Save scheduled digest send lock
        if: github.event_name == 'schedule' && steps.digest-ready.outputs.can_send == 'true'
        uses: actions/cache/save@v4
        with:
          path: .digest-send-lock
          key: close-digest-${{ steps.target.outputs.target_date }}
